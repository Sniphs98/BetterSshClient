name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hygiene:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Guard the tracked tree (no docs, keys, or .env)
        run: bash scripts/hygiene-guard.sh

      - name: Exercise the guard on fixtures
        run: bash scripts/hygiene-guard.test.sh

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + svelte-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build (renderer + main process)
        run: npm run build

  # electron-builder needs each OS's own native tooling (codesign stubs, NSIS,
  # AppImage/rpm/deb packagers), so this only proves `--dir` packaging works —
  # not that a signed installer is producible. No `--publish` here; a real
  # release run configures signing/publish separately.
  package-smoke-test:
    name: Package (--dir, ${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (unpacked directory only)
        run: npm run package:dir
