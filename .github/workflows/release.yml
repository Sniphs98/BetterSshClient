name: Release

# Triggered only by pushing a tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual dry run: package on every OS to validate a release before tagging.
  # `electron-builder --publish never` below means nothing is published.
  workflow_dispatch:

jobs:
  # ── 1. Quality checks (same as the CI workflow) ────────────────────────────
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # electron-builder names every artifact after the app's package.json
      # version, and the GitHub publish step trusts that name — so a tag that
      # disagrees with it would publish under the wrong filename.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./packages/electron/package.json').version")"
          [ "$version" = "${GITHUB_REF_NAME#v}" ] ||
            { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }

  # ── 2. Package + publish ────────────────────────────────────────────────────
  #
  # electron-builder builds natively per OS (it can't cross-compile a signed
  # macOS .dmg from Linux/Windows), and its GitHub provider both uploads the
  # installers and creates/updates the draft Release — no separate collect/
  # checksum/publish job needed, unlike a cross-compiled Rust binary matrix.
  package:
    name: Package · ${{ matrix.os }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package (dry run, no publish)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --publish never

      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

  # ── 3. Finalize the GitHub Release ──────────────────────────────────────────
  #
  # electron-builder's GitHub provider publishes a draft release per OS run
  # (each attaches its own installers) and relies on the *last* one to
  # un-draft it — this job does that explicitly instead, and adds the
  # CHANGELOG.md entry as the release body.
  publish:
    name: Finalize GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Extract the current release block from CHANGELOG.md: from the
      # "## X.Y.Z" heading down to the next "## " heading or "---" rule.
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip the leading "v" from the tag
          BODY=$(awk "/^## ${VERSION} /{found=1; next} found && (/^## /||/^---\$/){exit} found{print}" CHANGELOG.md)
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Un-draft the release and set its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --notes "${{ steps.changelog.outputs.body }}"
