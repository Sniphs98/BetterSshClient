# electron-builder packaging config. Mirrors the target set the old
# crates/omnyssh-gui/tauri.conf.json shipped (dmg, AppImage, deb, rpm, nsis).
#
# `directories.app` points at the Electron package (its package.json's
# `main`/`version`/`name` become the packaged app's); `packages/ui/build`
# (the SvelteKit static output) lives outside it, so it's copied in via
# `extraResources` at the same relative depth the dev-time app:// protocol
# handler already expects (`dist/../../ui/build`) — two levels above
# `app.asar` is exactly `resources/`, where `extraResources` lands it.
appId: com.sniphs.bettersshclient
productName: BetterSshClient
copyright: Copyright © BetterSshClient contributors

# The Release workflow (.github/workflows/release.yml) opens a draft release for the
# version first, then every OS run uploads into it — installers plus the latest*.yml
# manifests electron-updater reads — and the workflow publishes it once all are in.
publish:
  provider: github
  owner: Sniphs98
  repo: BetterSshClient
  releaseType: draft

# One predictable, space-free name per file, and none shared between platforms (the
# Windows and macOS zips would otherwise collide in the release).
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: packages/electron
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.test.js"
  - "!**/*.test.js.map"

extraResources:
  - from: packages/ui/build
    to: ui/build

asarUnpack:
  - "**/*.node"

mac:
  # The zip is what electron-updater installs on macOS; the dmg is for first installs.
  # (Self-update on macOS additionally needs a signed build.)
  target: [dmg, zip]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  icon: build/icon.icns
  category: public.app-category.developer-tools

win:
  target: [nsis, portable, zip]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  icon: build/icon.ico
  # electron-builder otherwise fetches the (macOS-targeted) winCodeSign bundle even
  # for a plain unsigned Windows build, then fails extracting it here: its symlinks
  # need SeCreateSymbolicLinkPrivilege, which a non-admin/non-Developer-Mode Windows
  # account doesn't have. Not needed anyway — this build isn't signed.
  signAndEditExecutable: false

linux:
  target: [AppImage, deb, rpm]
  icon: build/icons
  category: Utility
  desktop:
    entry:
      Comment: SSH dashboard, terminal, and SFTP file manager

portable:
  artifactName: ${productName}-${version}-portable.${ext}

nsis:
  # The installer electron-updater updates through (latest.yml points at it).
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
